name: Contrarian two-year backtest

on:
  push:
    branches:
      - temp-contrarian-backtest-20260728
    paths:
      - 'contrarian_backtest.py'
      - 'sitecustomize.py'
      - '.github/workflows/contrarian_backtest.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'contrarian_backtest.py'
      - 'sitecustomize.py'
      - '.github/workflows/contrarian_backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy requests beautifulsoup4 lxml xlrd openpyxl yfinance scipy matplotlib
      - name: Cache official FRED HY OAS CSV
        shell: bash
        run: |
          mkdir -p output
          curl --http1.1 --fail --location --retry 6 --retry-all-errors --connect-timeout 30 --max-time 420 \
            --user-agent 'Mozilla/5.0' \
            'https://fred.stlouisfed.org/graph/fredgraph.csv?id=BAMLH0A0HYM2' \
            --output output/fred_hy_oas.csv
          test -s output/fred_hy_oas.csv
          head -n 3 output/fred_hy_oas.csv
          tail -n 3 output/fred_hy_oas.csv
      - name: Run backtest
        shell: bash
        run: |
          set +e
          python contrarian_backtest.py 2>&1 | tee output/run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" | tee -a output/run.log
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contrarian-backtest-results
          path: output/**
