name: Contrarian two-year backtest

on:
  push:
    branches:
      - temp-contrarian-backtest-20260728
    paths:
      - 'contrarian_backtest.py'
      - 'sitecustomize.py'
      - '.github/workflows/contrarian_backtest.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'contrarian_backtest.py'
      - 'sitecustomize.py'
      - '.github/workflows/contrarian_backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy requests beautifulsoup4 lxml xlrd openpyxl yfinance scipy matplotlib
      - name: Cache HY OAS series
        shell: bash
        run: |
          mkdir -p output
          set +e
          timeout 90 curl --http1.1 --fail --location --retry 2 --retry-all-errors --connect-timeout 20 --max-time 75 \
            --user-agent 'Mozilla/5.0' \
            'https://fred.stlouisfed.org/graph/fredgraph.csv?id=BAMLH0A0HYM2' \
            --output output/fred_hy_oas.csv
          code=$?
          set -e
          if [ "$code" -eq 0 ] && [ -s output/fred_hy_oas.csv ]; then
            echo 'official_fred_csv' > output/hy_oas_transport.txt
          else
            rm -f output/fred_hy_oas.csv
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 180 \
              --user-agent 'Mozilla/5.0' \
              'https://huggingface.co/datasets/Sashank-810/crisisnet-dataset/resolve/main/Module_1/credit_spreads/BAMLH0A0HYM2.csv?download=true' \
              --output output/fred_hy_oas.csv
            echo 'public_fred_series_mirror_huggingface' > output/hy_oas_transport.txt
          fi
          test -s output/fred_hy_oas.csv
          head -n 3 output/fred_hy_oas.csv
          tail -n 3 output/fred_hy_oas.csv
          cat output/hy_oas_transport.txt
      - name: Run backtest
        shell: bash
        run: |
          set +e
          python contrarian_backtest.py 2>&1 | tee output/run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" | tee -a output/run.log
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contrarian-backtest-results
          path: output/**
