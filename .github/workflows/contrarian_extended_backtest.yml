name: Contrarian extended 2020-2026 backtest

on:
  push:
    branches:
      - temp-contrarian-backtest-20260728
    paths:
      - 'contrarian_extended_backtest.py'
      - 'extended_cnn_patch.py'
      - '.github/workflows/contrarian_extended_backtest.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'contrarian_extended_backtest.py'
      - 'extended_cnn_patch.py'
      - '.github/workflows/contrarian_extended_backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy requests beautifulsoup4 lxml xlrd openpyxl yfinance scipy matplotlib
      - name: Cache audited external transports
        shell: bash
        run: |
          mkdir -p output_extended
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 180 \
            --user-agent 'Mozilla/5.0' \
            'https://huggingface.co/datasets/Sashank-810/crisisnet-dataset/resolve/main/Module_1/credit_spreads/BAMLH0A0HYM2.csv?download=true' \
            --output output_extended/fred_hy_oas.csv
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 180 \
            --user-agent 'Mozilla/5.0' \
            'https://raw.githubusercontent.com/whit3rabbit/fear-greed-data/main/fear-greed.csv' \
            --output output_extended/cnn_fear_greed_archive.csv
          test -s output_extended/fred_hy_oas.csv
          test -s output_extended/cnn_fear_greed_archive.csv
      - name: Run extended backtest
        shell: bash
        run: |
          set +e
          python -c "import extended_cnn_patch; import runpy; runpy.run_path('contrarian_extended_backtest.py', run_name='__main__')" 2>&1 | tee output_extended/run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" | tee -a output_extended/run.log
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contrarian-extended-backtest-results
          path: output_extended/**
