name: CFTC percentile calculation

on:
  pull_request:
    paths:
      - cftc_percentile.py

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate exact percentile
        run: python cftc_percentile.py | tee result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cftc-percentile-result
          path: result.txt
